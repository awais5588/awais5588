<svg xmlns="http://www.w3.org/2000/svg" width="590" height="214" viewBox="0 0 590 214" role="img" aria-label="Aegis — Ai Agent Governance">
  <defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#7de3ff"/></linearGradient>
    <radialGradient id="cg"><stop offset="0" stop-color="#5b8cff" stop-opacity="0.35"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
    <clipPath id="cc"><rect width="590" height="214" rx="18"/></clipPath></defs>

  <g clip-path="url(#cc)">
    <rect width="590" height="214" fill="#090c1c"/>
    <circle cx="550" cy="20" r="170" fill="url(#cg)"><animate attributeName="opacity" values="0.5;1;0.5" dur="6s" begin="5.6s" repeatCount="indefinite"/></circle>
    <text x="30" y="40" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#5b8cff">09</text>
    <text x="62" y="40" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" letter-spacing="2" fill="#8c95b8">AI AGENT GOVERNANCE</text>
    <text x="30" y="82" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="800" fill="#e9edff" letter-spacing="-0.6">Aegis</text>
    <text x="30" y="112" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8c95b8">An orchestration platform that governs autonomous AI agents</text><text x="30" y="133" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8c95b8">instead of simply running them — who does the work, who judges</text><text x="30" y="154" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8c95b8">it, who decides when to stop.</text>
    <rect x="30" y="174" width="92" height="26" rx="13" fill="#0d1226" stroke="#1a2142"/><text x="76" y="191.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#e9edff">AI agents</text><rect x="130" y="174" width="123" height="26" rx="13" fill="#0d1226" stroke="#1a2142"/><text x="192" y="191.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#e9edff">Orchestration</text><rect x="261" y="174" width="108" height="26" rx="13" fill="#0d1226" stroke="#1a2142"/><text x="315" y="191.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#e9edff">Audit trail</text>
    <text x="560" y="192" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" fill="#8c95b8">no public link yet</text>
  </g>
  <rect x="353" y="22" width="207" height="26" rx="13" fill="#0d1226" stroke="#1a2142"/>
  <circle cx="369" cy="35" r="4" fill="#7de3ff"><animate attributeName="opacity" values="1;0.25;1" dur="2s" begin="5.6s" repeatCount="indefinite"/></circle>
  <text x="381" y="39.5" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" letter-spacing="1.2" fill="#e9edff">PERSONAL · IN PROGRESS</text>
  <rect x="0.5" y="0.5" width="589" height="213" rx="18" fill="none" stroke="#1a2142"/>
  <rect x="0.5" y="0.5" width="589" height="213" rx="18" fill="none" stroke="url(#acc)" stroke-width="1.6" stroke-dasharray="150 1458" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-1608" dur="8s" begin="5.6s" repeatCount="indefinite"/>
