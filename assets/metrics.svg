<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="3+ years, 3 product teams, 9 projects, 3 chains">
  <defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#7de3ff"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient></defs>
  <rect width="1200" height="150" rx="18" fill="#04050b"/>

  <g transform="translate(0,0)">
    <rect x="0.5" y="0.5" width="284" height="149" rx="18" fill="#090c1c" stroke="#1a2142"/>
    <circle cx="255" cy="34" r="70" fill="url(#glow)" opacity="0.25"/>
    <text x="26" y="72" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="800" fill="url(#acc)" letter-spacing="-1.5">3+</text>
    <text x="26" y="100" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="12" letter-spacing="2.5" fill="#e9edff">YEARS</text>
    <text x="26" y="124" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8c95b8">building MERN &amp; Web3 products</text>
    <rect x="26" y="136" width="60" height="2" rx="1" fill="url(#acc)">
      <animate attributeName="width" values="20;233;20" dur="6s" begin="0.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    </rect>
  </g>
  <g transform="translate(305,0)">
    <rect x="0.5" y="0.5" width="284" height="149" rx="18" fill="#090c1c" stroke="#1a2142"/>
