    <text x="26" y="72" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="800" fill="url(#acc)" letter-spacing="-1.5">3</text>
    <text x="26" y="100" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="12" letter-spacing="2.5" fill="#e9edff">PRODUCT TEAMS</text>
    <text x="26" y="124" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8c95b8">Biokript · BlocTech Solutions · Encodix</text>
    <rect x="26" y="136" width="60" height="2" rx="1" fill="url(#acc)">
      <animate attributeName="width" values="20;233;20" dur="6s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    </rect>
  </g>
  <g transform="translate(610,0)">
    <rect x="0.5" y="0.5" width="284" height="149" rx="18" fill="#090c1c" stroke="#1a2142"/>
    <circle cx="255" cy="34" r="70" fill="url(#glow)" opacity="0.25"/>
    <text x="26" y="72" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="800" fill="url(#acc)" letter-spacing="-1.5">9</text>
    <text x="26" y="100" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="12" letter-spacing="2.5" fill="#e9edff">PROJECTS</text>
    <text x="26" y="124" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8c95b8">8 live in production + Aegis</text>
    <rect x="26" y="136" width="60" height="2" rx="1" fill="url(#acc)">
      <animate attributeName="width" values="20;233;20" dur="6s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    </rect>
  </g>
  <g transform="translate(915,0)">
    <rect x="0.5" y="0.5" width="284" height="149" rx="18" fill="#090c1c" stroke="#1a2142"/>
    <circle cx="255" cy="34" r="70" fill="url(#glow)" opacity="0.25"/>
    <text x="26" y="72" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="800" fill="url(#acc)" letter-spacing="-1.5">3</text>
    <text x="26" y="100" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="12" letter-spacing="2.5" fill="#e9edff">CHAINS</text>
    <text x="26" y="124" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8c95b8">Ethereum · Solana · BNB Chain</text>
    <rect x="26" y="136" width="60" height="2" rx="1" fill="url(#acc)">
      <animate attributeName="width" values="20;233;20" dur="6s" begin="1.7999999999999998s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    </rect>
