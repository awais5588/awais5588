<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="About: I'm a full stack engineer. For the past three and a half years I've worked across the whole stack — the interface people touch, the API behind it, and the database underneath. Much of that work has been in Web3, where a single click can move real tokens. That shapes how I build: clear states, honest errors, and backends that don't guess.">
  <defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#7de3ff"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient></defs>
  <rect width="1200" height="330" rx="24" fill="#04050b"/>

  <rect x="0.5" y="0.5" width="1199" height="329" rx="24" fill="#090c1c" stroke="#1a2142"/>
  <circle cx="180" cy="40" r="260" fill="url(#glow)" opacity="0.35"><animate attributeName="cx" values="180;300;180" dur="12s" repeatCount="indefinite"/></circle>
  <text x="60" y="64" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13" letter-spacing="3" fill="#5b8cff">00 — ABOUT</text>
  <text x="60" y="118" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="800" fill="#e9edff" letter-spacing="-1">Quiet interfaces,<tspan fill="url(#acc)"> careful systems.</tspan></text>
  <text x="60" y="164" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8c95b8">I'm a full stack engineer. For the past three and a half years I've worked across the</text><text x="60" y="189" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8c95b8">whole stack — the interface people touch, the API behind it, and the database</text><text x="60" y="214" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8c95b8">underneath.</text>
  <text x="60" y="252" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8c95b8">Much of that work has been in Web3, where a single click can move real tokens. That</text><text x="60" y="277" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8c95b8">shapes how I build: clear states, honest errors, and backends that don't guess.</text>
  <rect x="780" y="40" width="1" height="250" fill="#1a2142"/>
  <text x="828" y="92" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="2" fill="#5b8cff">BASED IN</text><text x="828" y="112" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#e9edff">Pakistan · working remotely</text><text x="828" y="138" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="2" fill="#5b8cff">EXPERIENCE</text><text x="828" y="158" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#e9edff">3.5+ years · 4 product teams</text><text x="828" y="184" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="2" fill="#5b8cff">EDUCATION</text><text x="828" y="204" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#e9edff">BS Computer Science, 2024</text><text x="828" y="230" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="2" fill="#5b8cff">BUILDING NOW</text><text x="828" y="250" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#e9edff">Aegis — governing AI agents</text><text x="828" y="276" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="2" fill="#5b8cff">OPEN TO</text><text x="828" y="296" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#e9edff">Remote roles &amp; Web3 builds</text>
  <rect x="60" y="296" width="80" height="2" rx="1" fill="url(#acc)"><animate attributeName="width" values="30;680;30" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></rect>
</svg>
